<style>
body{margin:0;background:#0A0708;}
a{color:#E4D6F5;}a:hover{color:#FFFFFF;}
img{display:block;}
.navl{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:#F2ECF0;font-weight:600;transition:background .25s;}
.navl:hover{background:#2A1A20;color:#FFFFFF;}
.navl.on{background:var(--accent);color:#0A0708;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;text-decoration:none;transition:transform .25s;}
.btn:hover{transform:translateY(-2px);}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #4A3640;background:transparent;color:#F2ECF0;font-family:'Manrope',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:background .25s,color .25s,border-color .25s;}
.tab:hover{border-color:var(--accent);}
.tab.on{background:var(--accent);color:#0A0708;border-color:var(--accent);}
.panel{animation:fade .5s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.cards{display:grid;gap:14px;padding-top:16px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;}
.inc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;margin:0;padding:0;list-style:none;}
.adds{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));}
@media (max-width: 760px){
.cards{grid-auto-flow:column;grid-auto-columns:82%;grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;}
.cards > *{scroll-snap-align:start;}
.inc{grid-template-columns:1fr;}
.adds{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
.mnav{scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.mnav::-webkit-scrollbar{display:none;}
.mnav > a{flex:none;}
</style>
