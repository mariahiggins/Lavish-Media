<script type="text/x-lm" id="lm-script" data-props='{"accent":{"editor":"color","default":"#C9B3EC","options":["#C9B3EC","#B89CE6","#E4D8F5"]},"wine":{"editor":"color","default":"#6A0A1C","options":["#6A0A1C","#55071A","#7E0E22"]},"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { first: '', last: '', phone: '', email: '', ig: '', svc: 'Not sure yet', msg: '', err: false };
}
renderVals() {
const accent = this.props.accent ?? '#C9B3EC';
const wine = this.props.wine ?? '#6A0A1C';
const st = this.state;
const keys = ['first', 'last', 'phone', 'email', 'ig', 'svc', 'msg'];
const set = {};
keys.forEach((k) => { set[k] = (e) => this.setState({ [k]: e.target.value, err: false }); });
const ready = ['first', 'last', 'phone', 'email', 'ig', 'msg'].every((k) => String(st[k]).trim() !== '');
const body = 'Name: ' + st.first + ' ' + st.last + '\nPhone: ' + st.phone + '\nEmail: ' + st.email + '\nInstagram: ' + st.ig + '\nInterested in: ' + st.svc + '\n\n' + st.msg;
const mailHref = 'mailto:mariahiggins0821@gmail.com?subject=' + encodeURIComponent('Lavish Media inquiry — ' + st.first + ' ' + st.last) + '&body=' + encodeURIComponent(body);
const svcs = ['Not sure yet', 'Social Media Management', 'Content Creation', 'Social Strategy & Audit', 'Strategy & Branding', 'Website & Portfolio Building', 'UGC', 'Influencer Marketing', 'Content Bestie', 'Event Content Creation'];
const status = st.status || 'idle';
const submit = (e) => {
e.preventDefault();
if (!ready) { this.setState({ err: true }); return; }
const form = e.currentTarget;
this.setState({ status: 'sending' });
const data = { first_name: st.first, last_name: st.last, phone: st.phone, email: st.email, instagram: st.ig, service: st.svc, message: st.msg, _subject: 'New Lavish Media website inquiry' };
const fallback = () => { try { form.submit(); this.setState({ status: 'ok' }); } catch (x) { this.setState({ status: 'fail' }); } };

fetch('https://formspree.io/f/xnpdgqyw', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) })
.then((res) => { if (res.ok) this.setState({ status: 'ok' }); else this.setState({ status: 'fail' }); })
.catch(fallback);
} catch (x) { fallback(); }
};
return {
accent, wine,
v: st, set,
services: svcs.map((n) => ({ n })),
showErr: st.err && !ready,
submit,
isOk: status === 'ok', notOk: status !== 'ok', isFail: status === 'fail',
sendLabel: status === 'sending' ? 'Sending…' : 'Send message'
};
}
