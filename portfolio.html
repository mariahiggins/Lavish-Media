<style>
body{margin:0;background:#0A0708;}
a{color:#E4D6F5;}a:hover{color:#FFFFFF;}
img{display:block;}

.navl:hover{background:#2A1A20;color:#FFFFFF;}
.navl.on{background:var(--accent);color:#0A0708;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;text-decoration:none;transition:transform .25s;}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px;}

.chip:hover{border-color:var(--accent);background:var(--accent);color:#0A0708;}
.car{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 30px) / 4);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:4px;}
.car::-webkit-scrollbar{display:none;}
.car.wide{grid-auto-columns:calc((100% - 10px) / 2);}
.tile.wide{aspect-ratio:4/3;}

.arr{width:46px;height:46px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:22px;cursor:pointer;transition:background .25s,color .25s;}
.arr:hover{background:var(--accent);color:#0A0708;}
.tile{position:relative;padding:0;border:0;background:#1A1013;cursor:zoom-in;overflow:hidden;border-radius:4px;aspect-ratio:3/4;}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
.tile:hover img{transform:scale(1.05);}
.rv{opacity:1;}
@supports (animation-timeline: view()){.rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 25%;}}
.pintro{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 46%,#4A2C58 0%,#1E1220 32%,#0A0708 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;animation:pgone .01s 1.18s forwards;}
@keyframes pgone{to{opacity:0;visibility:hidden;}}
.pcam{width:min(64vw,400px);height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:cpop .65s .1s both cubic-bezier(.3,1.6,.5,1),cshot .22s .95s ease-in-out;}
@keyframes cpop{from{transform:scale(.25) rotate(-14deg);opacity:0;}to{transform:none;opacity:1;}}
@keyframes cshot{50%{transform:scale(.94) rotate(-1.5deg);}}
.pcap{display:flex;align-items:baseline;gap:4px;animation:fd .5s .45s both;}
.pflash{position:fixed;inset:0;z-index:201;background:#FFFFFF;opacity:0;pointer-events:none;animation:flash .8s 1.05s forwards;}
@keyframes flash{0%{opacity:0;}10%{opacity:1;}100%{opacity:0;visibility:hidden;}}
@media (prefers-reduced-motion: reduce){.pintro,.pflash{display:none!important;}}
@keyframes rv{from{transform:translateY(40px);}to{transform:none;}}
.lb{position:fixed;inset:0;z-index:300;background:rgba(10,7,8,.96);display:flex;align-items:center;justify-content:center;padding:70px 16px 70px;box-sizing:border-box;animation:fd .3s ease both;}
@keyframes fd{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
.mnav{scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.mnav::-webkit-scrollbar{display:none;}
.mnav > a{flex:none;}
</style>
